name: Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - 'CMakeLists.txt'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/**'
      - 'platforms/**'
      - 'patches/**'
      - '.github/workflows/build.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  #  macOS (arm64 + x86_64) × (static + JNI) = 4 builds
  # ──────────────────────────────────────────────────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        config: [macos-arm64, macos-x86_64]
        target: [tdlib, tdlib_jni]
    runs-on: macos-latest
    name: "macOS · ${{ matrix.config }} · ${{ matrix.target == 'tdlib_jni' && 'JNI' || 'static' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install gperf

      - name: Install Rosetta (for x86_64 cross-compilation)
        if: matrix.config == 'macos-x86_64'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Debug info
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          bazel version
          which clang
          clang --version

      - name: Build TDLib
        env:
          # Force Bazel/rules_foreign_cc to use host tools for make, cmake, etc.
          CC: clang
          CXX: clang++
          BAZEL_CXXOPTS: "-arch x86_64"
          BAZEL_LINKOPTS: "-arch x86_64"
          CFLAGS: "-arch x86_64"
          CXXFLAGS: "-arch x86_64"
          LDFLAGS: "-arch x86_64"
        run: |
          bazel build //:${{ matrix.target }} --config=${{ matrix.config }}

  # ──────────────────────────────────────────────────────────
  #  Linux (x86_64 + arm64) × (static + JNI) = 4 builds
  # ──────────────────────────────────────────────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        config: [linux-x86_64, linux-arm64]
        target: [tdlib, tdlib_jni]
        include:
          - config: linux-x86_64
            runner: ubuntu-latest
          - config: linux-arm64
            runner: ubuntu-24.04-arm    # GitHub ARM64 runner
    runs-on: ${{ matrix.runner }}
    name: "Linux · ${{ matrix.config }} · ${{ matrix.target == 'tdlib_jni' && 'JNI' || 'static' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Build TDLib
        run: bazel build //:${{ matrix.target }} --config=${{ matrix.config }}

  # ──────────────────────────────────────────────────────────
  #  Windows (x64 + arm64) × (static + JNI) = 4 builds
  #  arm64 is cross-compiled from x64.
  # ──────────────────────────────────────────────────────────
  windows:
    strategy:
      fail-fast: false
      matrix:
        config: [windows-x64, windows-arm64]
        target: [tdlib, tdlib_jni]
    runs-on: windows-latest
    name: "Windows · ${{ matrix.config }} · ${{ matrix.target == 'tdlib_jni' && 'JNI' || 'static' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: choco install gperf -y

      - name: Build TDLib
        run: bazel build //:${{ matrix.target }} --config=${{ matrix.config }}

  # ──────────────────────────────────────────────────────────
  #  Android (4 ABIs) × JNI = 4 builds
  # ──────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [android-arm64-v8a, android-armeabi-v7a, android-x86_64, android-x86]
    name: Android (${{ matrix.abi }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Build TDLib JNI
        run: bazel build //:tdlib_jni --config=${{ matrix.abi }}

  # ──────────────────────────────────────────────────────────
  #  iOS (arm64 + arm64-simulator + x86_64-simulator) = 3 builds
  # ──────────────────────────────────────────────────────────
  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ios-arm64, ios-arm64-simulator, ios-x86_64-simulator]
    name: iOS (${{ matrix.config }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install gperf

      - name: Build TDLib (static)
        run: bazel build //:tdlib --config=${{ matrix.config }}
