name: Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  #  Detect TDLib version from submodule
  # ──────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tdlib_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract TDLib version
        id: version
        run: |
          VERSION=$(grep -oP 'project\(TDLib\s+VERSION\s+\K[0-9.]+' td/CMakeLists.txt || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TDLib version: $VERSION"

  # ──────────────────────────────────────────────────────────
  #  macOS (arm64 + x86_64) × (static + JNI) = 4 builds
  # ──────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: macos-arm64
            target: tdlib
            artifact: tdlib-macos-arm64
            out: tdlib/macos/arm64
          - config: macos-arm64
            target: tdlib_jni
            artifact: tdlib-macos-jni-arm64
            out: tdlib/macos-jni/arm64
          - config: macos-x86_64
            target: tdlib
            artifact: tdlib-macos-x86_64
            out: tdlib/macos/x86_64
          - config: macos-x86_64
            target: tdlib_jni
            artifact: tdlib-macos-jni-x86_64
            out: tdlib/macos-jni/x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install gperf

      - name: Install Rosetta (for x86_64 cross-compilation)
        if: matrix.config == 'macos-x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Setup Conan
        run: |
          pip3 install --break-system-packages conan
          conan profile detect --force

      - name: Build TDLib
        run: ./build.sh ${{ matrix.config }} ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  #  Linux (x86_64 + arm64) × (static + JNI) = 4 builds
  # ──────────────────────────────────────────────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux-x86_64
            target: tdlib
            runner: ubuntu-latest
            artifact: tdlib-linux-x86_64
            out: tdlib/linux/x86_64
          - config: linux-x86_64
            target: tdlib_jni
            runner: ubuntu-latest
            artifact: tdlib-linux-jni-x86_64
            out: tdlib/linux-jni/x86_64
          - config: linux-arm64
            target: tdlib
            runner: ubuntu-24.04-arm
            artifact: tdlib-linux-arm64
            out: tdlib/linux/arm64
          - config: linux-arm64
            target: tdlib_jni
            runner: ubuntu-24.04-arm
            artifact: tdlib-linux-jni-arm64
            out: tdlib/linux-jni/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Setup Conan
        run: |
          pip3 install --break-system-packages conan
          conan profile detect --force

      - name: Build TDLib
        run: ./build.sh ${{ matrix.config }} ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  #  Windows (x64 + arm64) × (static + JNI) = 4 builds
  # ──────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: windows-x64
            target: tdlib
            artifact: tdlib-windows-x64
            out: tdlib/windows/x64
          - config: windows-x64
            target: tdlib_jni
            artifact: tdlib-windows-jni-x64
            out: tdlib/windows-jni/x64
          - config: windows-arm64
            target: tdlib
            artifact: tdlib-windows-arm64
            out: tdlib/windows/arm64
          - config: windows-arm64
            target: tdlib_jni
            artifact: tdlib-windows-jni-arm64
            out: tdlib/windows-jni/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: choco install gperf -y

      - name: Setup Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Build TDLib
        run: .\build.ps1 -Platform ${{ matrix.config }} -Target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  #  Android (4 ABIs)
  # ──────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Setup Conan
        run: |
          pip3 install --break-system-packages conan
          conan profile detect --force

      - name: Build TDLib JNI
        run: ./build.sh android-${{ matrix.abi }} tdlib_jni

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-${{ matrix.abi }}
          path: tdlib/android/${{ matrix.abi }}
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  #  iOS (arm64 device + simulators)
  # ──────────────────────────────────────────────────────────
  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64-simulator, x86_64-simulator]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install gperf

      - name: Setup Conan
        run: |
          pip3 install --break-system-packages conan
          conan profile detect --force

      - name: Build TDLib
        run: ./build.sh ios-${{ matrix.arch }} tdlib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-ios-${{ matrix.arch }}
          path: tdlib/ios/${{ matrix.arch }}
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  #  Release: collect all artifacts
  # ──────────────────────────────────────────────────────────
  release:
    needs: [version, macos, linux, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reorganize artifacts
        run: |
          mkdir -p release/tdlib
          for dir in artifacts/tdlib-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            platform_info="${name#tdlib-}"
            mkdir -p "release/tdlib/$platform_info"
            cp -r "$dir"/* "release/tdlib/$platform_info/" 2>/dev/null || true
          done
          cd release
          tar czf tdlib-all.tar.gz tdlib/
          echo "Archive contents:"
          tar tzf tdlib-all.tar.gz | head -50

      - name: Create per-platform archives
        run: |
          cd artifacts
          for dir in tdlib-*; do
            [ -d "$dir" ] || continue
            tar czf "${dir}.tar.gz" "$dir"
            echo "Created ${dir}.tar.gz"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.tdlib_version }}
          name: TDLib ${{ needs.version.outputs.tdlib_version }}
          body: |
            Prebuilt TDLib libraries for version ${{ needs.version.outputs.tdlib_version }}.

            ## Platforms

            ### Native static libraries (for Kotlin/Native, C/C++)
            - **iOS**: arm64, arm64-simulator, x86_64-simulator
            - **macOS**: arm64, x86_64
            - **Linux**: x86_64, arm64
            - **Windows**: x64, arm64

            ### JNI shared libraries (for JVM / Android)
            - **Android**: arm64-v8a, armeabi-v7a, x86_64, x86
            - **macOS**: arm64, x86_64
            - **Linux**: x86_64, arm64
            - **Windows**: x64, arm64
          files: |
            release/tdlib-all.tar.gz
            artifacts/tdlib-*.tar.gz
          draft: false
          prerelease: false
          make_latest: true
