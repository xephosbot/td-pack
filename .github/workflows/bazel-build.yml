name: Bazel Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/**'
      - 'platforms/**'
      - '.github/workflows/bazel-build.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  #  Linux (x86_64) — native build
  # ──────────────────────────────────────────────────────────
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Build TDLib (static)
        run: bazel build //:tdlib --config=linux-x86_64

      - name: Build TDLib (JNI)
        run: bazel build //:tdlib_jni --config=linux-x86_64

  # ──────────────────────────────────────────────────────────
  #  macOS (arm64) — native build
  # ──────────────────────────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install gperf

      - name: Build TDLib (static)
        run: bazel build //:tdlib --config=macos-arm64

      - name: Build TDLib (JNI)
        run: bazel build //:tdlib_jni --config=macos-arm64
